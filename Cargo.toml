[workspace]
resolver = "2"
members = ["."]

[workspace.package]
version = "0.3.3"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/q-rault/gdhealth"
homepage = "https://github.com/q-rault/gdhealth"
authors = ["Quentin Rault"]

[package]
name = "gdhealth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Code-health CLI for Godot and GDScript repositories"
readme = "README.md"
keywords = ["godot", "gdscript", "cli", "code-health"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/LICENSE.md"]

[lib]
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
gdsyntax = "0.1.1"
globset = "0.4"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
walkdir = "2.5"
