# region: minimal
[discovery]
include = ["**/*.gd"]
exclude = ["addons/**", ".godot/**", "reports/**"]
# endregion

# region: full-config
# ── Project ──────────────────────────────────────────────────────────────────
# Optional. Overridden at runtime by --root if provided.
[project]
root = "."

# ── Discovery ─────────────────────────────────────────────────────────────────
# Glob patterns for file discovery.
# Patterns prefixed with ! are negation (exclusions within an include pattern).
[discovery]
include = ["**/*.gd"]
exclude = ["addons/**", ".godot/**", "reports/**"]

# ── Groups ───────────────────────────────────────────────────────────────────
# Named groups assign files to logical layers.
# Files not matched by any group are labelled "ungrouped" in reports.
# Group patterns are matched against project-relative paths.
[groups]
gameplay = ["*.gd", "!server/**", "!net/**", "!ai/**", "!test/**"]
net      = ["net/**"]
ai       = ["ai/**", "server/ai/**"]
server   = ["server/**"]
test     = ["test/**"]

# ── Thresholds ───────────────────────────────────────────────────────────────
# Findings below warn are ignored. Findings between warn and critical get
# severity "warning". Findings at or above critical get severity "critical".
[thresholds]
file_lines_warn     = 500
file_lines_critical = 1000

function_lines_warn     = 40
function_lines_critical = 80

cyclomatic_warn     = 10
cyclomatic_critical = 15

nesting_warn     = 4
nesting_critical = 6

# parameters_warn has no critical counterpart
parameters_warn = 5

# ── Policy ────────────────────────────────────────────────────────────────────
[policy]
# Cycles whose files all match one of these glob patterns are suppressed.
# Leave empty to report all cycles.
allow_cycles = []

# Forbidden dependency rules: if a file in group `from` depends on a file
# in group `to`, a finding with the given severity is emitted.
[[policy.forbidden_dependencies]]
from     = "server"
to       = "gameplay"
severity = "critical"

[[policy.forbidden_dependencies]]
from     = "net"
to       = "server"
severity = "warning"

# ── Git ──────────────────────────────────────────────────────────────────────
# Git-derived signals (churn hotspots, ownership, co-change, prior-defect
# history) for `gdhealth health`. Shells to the system `git` binary — no
# git2/libgit2 dependency. Disable with --no-git or enabled = false.
[git]
enabled = true
blame_max_file_lines = 2000
hotspot_halflife_days = 60
co_change_window_days = 90
co_change_max_files_per_commit = 20
prior_defect_window_days = 180

# ── Refactoring ──────────────────────────────────────────────────────────────
# Bounds for the Break Cycle and Split File refactoring suggestions.
[refactoring]
max_cycle_files = 8
max_cut_edges = 2
split_file_min_symbols = 4
split_file_modularity_gate = 0.3

# ── Duplication ──────────────────────────────────────────────────────────────
# Token-kind clone detection (renamed identifiers still match).
[duplication]
enabled = true
min_token_window = 150
# endregion
